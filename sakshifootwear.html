<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/6e/35/f9/6e35f904f844bd5707234e637fe1a055.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <link href="sakshistyles.css" rel="stylesheet">
</head>
<body>
    <h1>Footwear</h1>
     <p style="text-align: center; font-size: 18px;">
        <a href="sakshicart.html" style="color: #4a3540; text-decoration: none;">🛒 Cart: <span id="cart-count">0</span></a>
    </p>
    <hr>
    <div class="products">
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/1200x/6d/f3/4b/6df34b221d5a3fe7c5f2eb5da26c67e5.jpg" height="250px" alt="Butterfly Heels image">
            <h3>Butterfly Heels</h3>
            <p>Price: $500</p>
            <button class="add-to-cart-btn" data-name="Butterfly Heels" data-price="500" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/9c/73/22/9c73227a5f8bb2a17525649369787ed5.jpg" height="250px" alt="Tulips heels image">
            <h3>Tulips Heels</h3>
            <p>Price: $250</p>
            <button class="add-to-cart-btn" data-name="Tulips Heels" data-price="250" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">        
            <img src="https://i.pinimg.com/1200x/00/0f/ff/000fff914b9d9ed052f9853770f0381c.jpg" height="250px" alt="rose lady heels image">
            <h3>Rose Lady Heels</h3>
            <p>Price: $300</p>
            <button class="add-to-cart-btn" data-name="Rose Lady Heels" data-price="300" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/c1/d5/55/c1d555302e5833aaa58f6e08c8527478.jpg" height="250px" alt="Rosela Red heels image">
            <h3>Rosela Red Heels</h3>
            <p>Price: $400</p>
            <button class="add-to-cart-btn" data-name="Rosela Red Heels" data-price="400" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
    </div>

    <style>
        .add-to-cart-btn {
            margin-top: 8px;
            margin-bottom: 10px;
            padding: 8px 18px;
            background-color: #c9a688;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .add-to-cart-btn:hover {
            background-color: #b08d6f;
        }
        .add-to-cart-btn.added {
            background-color: #7fa87f;
        }
    </style>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('sakshiCart')) || [];
        }
        function saveCart(cart) {
            localStorage.setItem('sakshiCart', JSON.stringify(cart));
        }
        function updateCartCount() {
            document.getElementById('cart-count').textContent = getCart().length;
        }
        function addToCart(btn) {
            const name = btn.getAttribute('data-name');
            const price = Number(btn.getAttribute('data-price'));
            const cart = getCart();
            cart.push({ name, price });
            saveCart(cart);
            updateCartCount();

            const originalText = btn.textContent;
            btn.textContent = 'Added ✓';
            btn.classList.add('added');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('added');
            }, 1000);
        }
        updateCartCount();
    </script>
</body>
</html>
