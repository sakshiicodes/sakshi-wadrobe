<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tops</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/6e/35/f9/6e35f904f844bd5707234e637fe1a055.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <link href="sakshistyles.css" rel="stylesheet">
</head>
<body>
    <h1>Tops</h1>
     <p style="text-align: center; font-size: 18px;">
        <a href="sakshicart.html" style="color: #4a3540; text-decoration: none;">🛒 Cart: <span id="cart-count">0</span></a>
    </p>
    <hr>
    <div class="products">
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/1200x/04/38/55/043855d5659d07ef48dc2fd2ea941c95.jpg" height="250px" alt="Black Lady Top image">
            <h3>Black Lady Top</h3>
            <p>Price: ₹800</p>
            <button class="add-to-cart-btn" data-name="Black Lady Top" data-price="800" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">    
            <img src="https://i.pinimg.com/1200x/ee/6c/ee/ee6cee48ffee7fe7ebd50493ca0b1045.jpg" height="250px" alt="White Brabie Top image">
            <h3>White Brabie Top</h3>
            <p>Price: ₹1200</p>
            <button class="add-to-cart-btn" data-name="White Brabie Top" data-price="1200" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/51/40/01/514001fbde0403e48c3fda11975f5fa9.jpg" height="250px" alt="Red Ruffle Swan Top image">
            <h3>Red Ruffle Swan Top</h3>
            <p>Price: ₹900</p>
            <button class="add-to-cart-btn" data-name="Red Ruffle Swan Top" data-price="900" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/4a/d3/94/4ad394178568703b3724fd99bff29d25.jpg" height="250px" alt="Black Ribbon Lace Top image">
            <h3>Black Ribbon Lace Top</h3>
            <p>Price: ₹900</p>
            <button class="add-to-cart-btn" data-name="Black Ribbon Lace Top" data-price="900" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
    </div>

    <style>
        .add-to-cart-btn {
            margin-top: 8px;
            margin-bottom: 10px;
            padding: 8px 18px;
            background-color: #c9a688;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .add-to-cart-btn:hover {
            background-color: #b08d6f;
        }
        .add-to-cart-btn.added {
            background-color: #7fa87f;
        }
    </style>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('sakshiCart')) || [];
        }
        function saveCart(cart) {
            localStorage.setItem('sakshiCart', JSON.stringify(cart));
        }
        function updateCartCount() {
            document.getElementById('cart-count').textContent = getCart().length;
        }
        function addToCart(btn) {
            const name = btn.getAttribute('data-name');
            const price = Number(btn.getAttribute('data-price'));
            const cart = getCart();
            cart.push({ name, price });
            saveCart(cart);
            updateCartCount();

            const originalText = btn.textContent;
            btn.textContent = 'Added ✓';
            btn.classList.add('added');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('added');
            }, 1000);
        }
        updateCartCount();
    </script>
</body>
</html>
