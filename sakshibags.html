<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bottoms</title>
    <link rel="icon" type="image/x-icon" href="https://i.pinimg.com/736x/6e/35/f9/6e35f904f844bd5707234e637fe1a055.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&display=swap" rel="stylesheet">
    <link href="sakshistyles.css" rel="stylesheet">
</head>
<body>
    <h1>Bottoms</h1>
     <p style="text-align: center; font-size: 18px;">
        <a href="sakshicart.html" style="color: #4a3540; text-decoration: none;">🛒 Cart: <span id="cart-count">0</span></a>
    </p>
    <hr>
    <div class="products">
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/ea/49/b2/ea49b20aeb5399f3a2ffaf05c45f6f7c.jpg" height="250px" alt="Blue Lace Jeans image">
            <h3>Blue Lace Jeans</h3>
            <p>Price: ₹800</p>
            <button class="add-to-cart-btn" data-name="Blue Lace Jeans" data-price="800" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">    
            <img src="https://i.pinimg.com/1200x/d0/b9/62/d0b962467092c6075980313589c2cad1.jpg" height="250px" alt="Maroon Leather Bottoms image">
            <h3>Maroon Leather Bottoms</h3>
            <p>Price: ₹1200</p>
            <button class="add-to-cart-btn" data-name="Maroon Leather Bottoms" data-price="1200" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/736x/fd/dd/46/fddd46dc5d9d9cbbfe52a349b5bc1f1f.jpg" height="250px" alt="Blush Pink Wrap Skirt image">
            <h3>Blush Pink Wrap Skirt</h3>
            <p>Price: ₹900</p>
            <button class="add-to-cart-btn" data-name="Blush Pink Wrap Skirt" data-price="900" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/1200x/db/98/63/db98639c7655a86a367eca996b9e5dcb.jpg" height="250px" alt="Floral Print and Lace Skirt image">
            <h3>Floral Print and Lace Skirt</h3>
            <p>Price: ₹900</p>
            <button class="add-to-cart-btn" data-name="Floral Print and Lace Skirt" data-price="900" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/1200x/61/2b/62/612b6265b376b3dba3293f1d643c4cfd.jpg" height="250px" alt="Black Leather Shorts Skirt image">
            <h3>Black Leather Shorts Skirt</h3>
            <p>Price: ₹1500</p>
            <button class="add-to-cart-btn" data-name="Black Leather Shorts Skirt" data-price="1500" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
        <div class="product">
            <p style="text-align: center; background-color: #e8d5c4; outline: 0.1px solid #c9a688;">
            <img src="https://i.pinimg.com/1200x/83/ba/c2/83bac2f3ed32f3a14d2dfbf25794bb33.jpg" height="250px" alt="Black Leather Wide-Leg Pants image">
            <h3>Black Leather Wide-Leg Pants</h3>
            <p>Price: ₹800</p>
            <button class="add-to-cart-btn" data-name="Black Leather Wide-Leg Pants" data-price="800" onclick="addToCart(this)">Add to Cart</button>
            </p>
        </div>
    </div>

    <style>
        .add-to-cart-btn {
            margin-top: 8px;
            margin-bottom: 10px;
            padding: 8px 18px;
            background-color: #c9a688;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
        }
        .add-to-cart-btn:hover {
            background-color: #b08d6f;
        }
        .add-to-cart-btn.added {
            background-color: #7fa87f;
        }
    </style>

    <script>
        function getCart() {
            return JSON.parse(localStorage.getItem('sakshiCart')) || [];
        }
        function saveCart(cart) {
            localStorage.setItem('sakshiCart', JSON.stringify(cart));
        }
        function updateCartCount() {
            document.getElementById('cart-count').textContent = getCart().length;
        }
        function addToCart(btn) {
            const name = btn.getAttribute('data-name');
            const price = Number(btn.getAttribute('data-price'));
            const cart = getCart();
            cart.push({ name, price });
            saveCart(cart);
            updateCartCount();

            const originalText = btn.textContent;
            btn.textContent = 'Added ✓';
            btn.classList.add('added');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('added');
            }, 1000);
        }
        updateCartCount();
    </script>
</body>
</html>
