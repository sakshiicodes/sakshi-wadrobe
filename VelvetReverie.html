<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velvet Reverie</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/66/35/f9/fe3504044d57072234e5.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2b0f1c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .hero-eyebrow {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: #c9a688;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hero-title {
            font-family: 'Alex Brush', cursive;
            font-size: 5rem;
            font-weight: 400;
            color: #f3e9e4;
            margin: 0;
        }

        .hero-divider {
            width: 60px;
            height: 1px;
            background-color: #c9a688;
            margin: 24px auto;
        }

        .hero-tagline {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.2rem;
            color: #e8d5c4;
            margin-bottom: 40px;
        }

        .shop-button {
            display: inline-block;
            border: 1px solid #c9a688;
            color: #f3e9e4;
            text-decoration: none;
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: 2px;
            padding: 16px 48px;
        }

        .shop-button:hover {
            background-color: #c9a688;
            color: #2b0f1c;
        }

        .site-footer {
            position: absolute;
            bottom: 30px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: #e8d5c4;
        }

        .site-footer a {
            color: #c9a688;
        }
    </style>
</head>
<body>

    <p class="hero-eyebrow">a closet, curated</p>
    <h1 class="hero-title">Velvet Reverie</h1>
    <div class="hero-divider"></div>
    <p class="hero-tagline">Pieces that feel like they've always been yours.</p>

    <a class="shop-button" href="sakshiwardrobe.html">Shop Now</a>

    <footer class="site-footer">
        <p>Write to us at <a href="mailto:yourmail@gmail.com">yourmail@gmail.com</a></p>
    </footer>
